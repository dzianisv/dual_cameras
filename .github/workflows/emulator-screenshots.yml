# Purpose: capture Play screenshots from real tested flows on the CI
# emulator. Same app, same build as the smoke test — but it taps through
# the camera screen, the Captions section of the Settings dialog,
# the filter slider above the record button, and a recording, saving
# one screenshot per step. It does NOT prove concurrent
# cameras, mic audio, or caption inference: emulator cameras are
# virtual, and sherpa-onnx runs through the native bridge. A real phone
# is still the proof gate and the source of the best screenshots (see
# ~/workspace/storycam/PHONE_TEST_PLAN.md).
#
# ISSUE #79 ADDENDUM (2026-11-16) — distinct REAL video feeds + full
# walkthrough: the emulator no longer plays the synthetic test pattern.
# The 'Download emulator camera feeds' step below fetches two Blender
# open-movie trailers (CC-BY 3.0, Blender Foundation — attribution in
# this comment and on issue #79; reuse in CI test feeds only, no
# redistribution) and loop-extends each to 600 s with ffmpeg, then the
# emulator plays them per camera: rear = Big Buck Bunny trailer (bright
# forest/bunny, unmistakable), front = Sintel trailer (snowy mountains /
# girl + dragon, unmistakable). Download-in-workflow, NOT committed
# fixtures: the clips are 7.6 MB + 17.8 MB downloads and the looped
# files are 45 MB + 161 MB — committing them would bloat the repo for
# every clone, while download.blender.org is a stable official source
# and the step fails loudly (curl -f) if a URL moves. No ffmpeg test
# patterns, no emulated feed, no other product's assets.
#   rear: https://download.blender.org/peach/trailer/trailer_720p.mov
#         (Big Buck Bunny, CC-BY 3.0, 1280x720 h264+aac, 33 s, 17.8 MB)
#   front: https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4
#         (Sintel, CC-BY 3.0, 1280x720 h264+aac, 52 s, 7.6 MB)
# The 600 s loop covers the whole walkthrough even if the emulator
# plays the file once through instead of looping it (unknown until a
# run — the launch motion pair + video proof below are the check).
# Paths are absolute via ${{ github.workspace }}: the emulator resolves
# videofile: paths on the HOST, and the runner's checkout dir is the
# only path that is the same in the download step and the emulator step.
# The script then walks EVERYTHING with the feeds live: all 8 filters
# in order, all 5 bottom-menu items + the settings sections they open,
# map zoom (double-tap + slider drag, value read back from the UI),
# record start/stop, last-video menu, share sheet, and a recorded-video
# frame proof (tools/preview_diff.py --video-proof). Walkthrough items
# print WALKTHROUGH <item>: PASS|FAIL lines to the log and never fail
# the run on their own — the results table is compiled from the log +
# screenshots and posted on #79. The CORE proof DOES fail the run:
# front/rear regions differ + both move at launch, and the recorded
# video's frames show two different moving feeds. If videofile fails
# on this emulator (black/frozen preview), those checks fail loudly —
# do NOT fall back to the test pattern; record the error on #79.
# Shot numbering: 01 launch, 10-17 filters, 20-27 settings sections,
# 04-07 recording/share (kept from the old flow), video-proof-t*.png
# frames from the recording. Old 02-captions-sheet / 03-filters shots
# are superseded by 23-section-captions / 11-filter-moody.
#
# SHELL RULE (learned the hard way, run 43491636991): the
# android-emulator-runner executes each line of `script:` as a SEPARATE
# `sh -c` call. Variables, functions, and heredocs do NOT survive
# across lines — a variable assigned on one line is empty on the next.
# Every command below is therefore self-contained on one line. Taps go
# through `tools/emulator_tap.py` (a repo file, not inline shell) which
# finds a node by text in `uiautomator dump` output and taps its center.
#
# SCREENSHOT RULE (run 43497670419, 2026-11-14): `adb shell screencap -p
# /sdcard/...` fails with 'Transport endpoint is not connected' — the
# emulator's sdcard is not mounted when the script runs. Screenshots go
# through `adb exec-out screencap -p > file.png`, which streams the PNG
# straight to the host and never touches the device filesystem.
#
# ANR RULE (run 43501670656, 2026-11-14): the launch shot showed a
# "Process system isn't responding" dialog — the SYSTEM process, not
# the app. The emulator has no hardware acceleration and 2 cores, so
# system_server starves during app startup. Dismiss it with a
# best-effort tap on 'Wait' (|| true: absent when no dialog) after
# launch and after starting recording, and give startup 30 s + 15 s
# to settle before the first shot.
#
# NOTIFICATION DIALOG RULE (run 43530242377, 2026-11-14): on first
# launch the model download starts at startup, so the app asks once for
# the POST_NOTIFICATIONS runtime permission — a MODAL system dialog
# ("Allow StoryCam to send you notifications?") that covers the camera
# screen. The 'Captions' button sits underneath it, so uiautomator
# finds no tappable "Captions" and the tap lands on the dialog instead.
# Dismiss it first with a best-effort tap on 'Allow' (|| true: the
# dialog only appears on first launch) before the first shot. Tapping
# Allow is the realistic path — it leaves notifications on for the
# download/caption progress the later shots exercise.
#
# RUN #10 ADDENDUM (run 43534775105, 2026-11-14): the 'Allow' tap did
# NOT dismiss the dialog — it tapped the dialog TITLE ("Allow
# StoryCam…") at (160,280), not the button, because emulator_tap.py
# took the first substring match. The matcher now prefers an exact
# text match, then a clickable node (see tools/emulator_tap.py).
# Belt-and-braces: the workflow also pre-grants POST_NOTIFICATIONS
# with `pm grant` (same as CAMERA/RECORD_AUDIO/location below), so on a fresh
# install the dialog never appears at all; the 'Allow' tap stays as
# the fallback in case the grant does not suppress it on this API
# level. Granting is fine for Play screenshots — the later shots
# exercise download/caption notifications, which need the permission
# on either way.
#
# RUN #11 ADDENDUM (run 43541261690, 2026-11-14): the run got past
# Captions and Filters (both taps worked) but died at 'Start recording'
# → NOT FOUND. Root cause is NOT the tap helper: the camera never
# initialized on its own. The app probed support at startup
# (_bootstrap) but only opened the camera when the shutter was tapped
# (main.dart _start); until then the shutter label was 'Open camera',
# 'Start recording' did not exist in the tree, and Filters/Photo/Swap
# were disabled (onFilters is null until `ready`, i.e. initialized).
# The shutter IS enabled on the emulator (pixel (255,82,109) =
# 0xFFFF526D in 01-launch.png, and _caps.isSupported is true).
#
# AUTO-INIT (issue #46, PR #51, 2026-11-15): the camera now opens
# itself at launch when permissions are granted, so the shutter reads
# 'Start recording' and there is no 'Open camera' button to tap. The
# 'Open camera' tap below stays as a best-effort fallback (|| true)
# for a failed auto-init — it does nothing when auto-init worked.
# If init fails on the emulator, 'Start recording' stays absent and the
# workflow fails loudly at that tap — that is the signal, not a
# tap-helper bug.
#
# HOW TO APPLY: the gh token has `workflow` scope since Den's 2026-11-14
# re-auth (verified by `gh auth status`), so push this file with git
# like any other file. Then dispatch:
#   gh workflow run emulator-screenshots.yml --ref main
# Screenshots land in the `emulator-play-screenshots` artifact
# (14-day retention). Review every screenshot visually before copying
# any of them into docs/play-assets/screenshots/ — a shot with a black
# preview, a cut-off button, or the wrong language is rejected, not
# shipped.
name: StoryCam emulator screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # STORYCAM_ABI=x86_64: build.gradle.kts strips every ABI except the
      # target one — without this the x86_64 APK ships with NO native libs
      # and crashes on launch ("Could not find 'libflutter.so'", run
      # 43528021798). The Play release build (build-apk.yml) leaves the
      # var unset and stays arm64-v8a.
      - name: Build release APK (x86_64)
        working-directory: packages/dual_cameras/example
        env:
          STORYCAM_ABI: x86_64
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64

#
# X64 RULE (run 43505361133, 2026-11-14): the release APK is arm64-only,
# and on the x86_64 emulator it runs under ARM translation (libhoudini).
# With no hardware acceleration and 2 cores that starves system_server
# into a persistent "Process system isn't responding" ANR and adb itself
# starts dying (dump killed with 137, daemon connection errors), so the
# 'Wait' tap could not even run and 'Captions' was never found. The
# emulator workflows therefore build an x86_64 APK, which runs natively
# on the x86_64 emulator. The Play release AAB stays arm64 — this build
# is emulator-only. Also give the emulator all 4 host cores and 4 GB RAM.
#
# MACOS RULE — DEAD END (run 43518382001, 2026-11-14): the macOS move
# failed the same way in both jobs. The emulator starts, then dies at
# once: "HVF error: HV_UNSUPPORTED / failed to initialize HVF: Invalid
# argument / QEMU main loop exits abnormally with code 1". The hosted
# macOS runner (macos-26-arm64, MacCloud) is itself a VM with no nested
# virtualization, so Hypervisor.framework is unavailable — there is no
# hardware acceleration on macOS runners either. Do NOT move these
# workflows back to macos-latest.
#
# KVM RULE (runs 43513063175 + 43518382001, 2026-11-14): the Linux
# runner DOES expose /dev/kvm, but the runner user is not in the kvm
# group (run 43513063175: "ProbeKVM: This user doesn't have permissions
# to use KVM (/dev/kvm)", kvm group line ends with no users), so the
# action silently added `-accel off` and the x86_64 emulator ran under
# pure software emulation: ~10 min boot, System UI ANR, adb SIGKILLed.
# Fix: `sudo chmod 666 /dev/kvm` in a step before the emulator step
# (passwordless sudo on hosted runners; mode change takes effect
# immediately, no re-login needed) and `disable-linux-hw-accel: false`
# so the action can never silently fall back to `-accel off` again.
# With KVM the x86_64 emulator boots in ~1-2 min. The 'Wait' taps stay
# as resilience — a slow first boot can still ANR system_server once.
      - name: Enable KVM for the emulator
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          sudo chmod 666 /dev/kvm 2>/dev/null || echo "chmod /dev/kvm skipped"
          ls -l /dev/kvm || true

      # ISSUE #79: fetch the two real camera feeds (Blender open-movie
      # trailers, CC-BY 3.0 — see the header addendum) and loop-extend
      # each to 600 s so the feed outlasts the walkthrough even if the
      # emulator plays the file once through instead of looping it.
      # ffmpeg is preinstalled on ubuntu-latest; the apt fallback only
      # runs if it is missing. curl -f fails the step if a URL moves.
      # ffprobe prints the resulting durations for the log.
      - name: Download emulator camera feeds (issue #79)
        run: |
          mkdir -p tools/emulator-feeds
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          curl -fSL --max-time 300 -o tools/emulator-feeds/sintel-trailer.mp4 https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4
          curl -fSL --max-time 300 -o tools/emulator-feeds/bbb-trailer.mov https://download.blender.org/peach/trailer/trailer_720p.mov
          ls -la tools/emulator-feeds/
          ffmpeg -y -v error -stream_loop 19 -i tools/emulator-feeds/sintel-trailer.mp4 -c copy -t 600 tools/emulator-feeds/front-feed.mp4
          ffmpeg -y -v error -stream_loop 19 -i tools/emulator-feeds/bbb-trailer.mov -c copy -t 600 tools/emulator-feeds/rear-feed.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 tools/emulator-feeds/front-feed.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 tools/emulator-feeds/rear-feed.mp4
          ls -la tools/emulator-feeds/

      # Pillow is needed by tools/preview_diff.py (region-aware preview
      # liveness + front/rear feed proof, issues #13/#79) and
      # imageio-ffmpeg provides the static ffmpeg binary the video proof
      # extracts frames with. Neither is preinstalled on the runner.
      - name: Install Pillow + imageio-ffmpeg for the image checks
        run: python3 -m pip install --quiet pillow imageio-ffmpeg

      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          cores: 4
          ram-size: 4096
          heap-size: 1024
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back videofile:${{ github.workspace }}/tools/emulator-feeds/rear-feed.mp4 -camera-front videofile:${{ github.workspace }}/tools/emulator-feeds/front-feed.mp4
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb install -r packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            adb shell pm grant app.storycam android.permission.CAMERA || true
            adb shell pm grant app.storycam android.permission.RECORD_AUDIO || true
            adb shell pm grant app.storycam android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant app.storycam android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant app.storycam android.permission.ACCESS_COARSE_LOCATION || true
            # #82 BEGIN — Bali mock location FIRST, before launch, so the
            # app's first location fix (and place label) is Bali, not the
            # emulator default. `adb emu geo fix` takes longitude first.
            adb emu geo fix 115.3088 -8.4264
            # #82 END
            adb shell am start -n app.storycam/.MainActivity
            sleep 30
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 15
            python3 tools/emulator_tap.py 'Allow' || true
            sleep 2
            python3 tools/emulator_tap.py 'Open camera' || true
            sleep 20
            adb exec-out screencap -p > 01-launch.png
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-launch.xml
            grep -o 'Mendocino[^"]*' /tmp/ui-launch.xml | head -1 || echo 'WALKTHROUGH place-name: no Mendocino text in tree (check the pill in 01-launch.png)'
            grep -o 'text="[^"]*"' /tmp/ui-launch.xml | head -60
            python3 tools/preview_diff.py --regions 01-launch.png --min-mean-diff 5.0 || (echo 'FEED PROOF FAILED: front-circle vs rear-area regions look the same in 01-launch.png - videofile feeds not distinct'; exit 1)
            sleep 3
            adb exec-out screencap -p > 01b-motion.png
            python3 tools/preview_diff.py 01-launch.png 01b-motion.png --min-diff 0.1 --box front || (echo 'FEED PROOF FAILED: no motion in the front-circle region between launch shots 3 s apart - front feed frozen'; exit 1)
            python3 tools/preview_diff.py 01-launch.png 01b-motion.png --min-diff 0.1 --box rear || (echo 'FEED PROOF FAILED: no motion in the rear region between launch shots 3 s apart - rear feed frozen'; exit 1)
            echo 'FEED PROOF (launch): front/rear regions differ + both feeds move over 3 s'
            python3 tools/emulator_tap.py 'Original' || echo 'WALKTHROUGH filter-Original: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 10-filter-original.png
            python3 tools/emulator_tap.py 'Moody' || echo 'WALKTHROUGH filter-Moody: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 11-filter-moody.png
            python3 tools/emulator_tap.py 'Hyper' || echo 'WALKTHROUGH filter-Hyper: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 12-filter-hyper.png
            python3 tools/emulator_tap.py 'Midnight' || echo 'WALKTHROUGH filter-Midnight: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 13-filter-midnight.png
            python3 tools/emulator_tap.py --swipe-on 'Midnight' left || echo 'WALKTHROUGH filter-row-scroll-1: FAIL (swipe missed)'
            sleep 1
            python3 tools/emulator_tap.py 'Simple' || echo 'WALKTHROUGH filter-Simple: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 14-filter-simple.png
            python3 tools/emulator_tap.py 'Jakarta' || echo 'WALKTHROUGH filter-Jakarta: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 15-filter-jakarta.png
            python3 tools/emulator_tap.py --swipe-on 'Jakarta' left || echo 'WALKTHROUGH filter-row-scroll-2: FAIL (swipe missed)'
            sleep 1
            python3 tools/emulator_tap.py 'Vice City' || echo 'WALKTHROUGH filter-Vice-City: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 16-filter-vice-city.png
            python3 tools/emulator_tap.py 'San Andreas' || echo 'WALKTHROUGH filter-San-Andreas: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 17-filter-san-andreas.png
            echo 'WALKTHROUGH filters: 8 taps attempted, see shots 10-17 + FAIL lines above'
            adb shell input tap 60 105 && adb shell input tap 60 105
            sleep 2
            python3 tools/emulator_tap.py 'Map' || echo 'WALKTHROUGH menu-Map: FAIL (tap missed)'
            sleep 3
            adb exec-out screencap -p > 20-section-map.png
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-map.xml
            grep -o 'Map zoom [0-9.]*' /tmp/ui-map.xml | head -1 || echo 'WALKTHROUGH map-zoom-doubletap: FAIL (no Map zoom text in tree)'
            grep -q 'Map zoom 16.0' /tmp/ui-map.xml && echo 'WALKTHROUGH map-zoom-doubletap: FAIL (still 16.0 after double-tap on the map circle)' || echo 'WALKTHROUGH map-zoom-doubletap: PASS (zoom value changed, see Map zoom line above)'
            python3 tools/emulator_tap.py --drag-slider 'Map zoom' 0.8 || echo 'WALKTHROUGH map-zoom-slider: FAIL (value did not change)'
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-map2.xml
            grep -o 'Map zoom [0-9.]*' /tmp/ui-map2.xml | head -1 || echo 'WALKTHROUGH map-zoom-slider: FAIL (no Map zoom text after drag)'
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Front' || echo 'WALKTHROUGH menu-Front: FAIL (tap missed)'
            sleep 3
            adb exec-out screencap -p > 21-section-front.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Rear' || echo 'WALKTHROUGH menu-Rear: FAIL (tap missed)'
            sleep 3
            adb exec-out screencap -p > 22-section-rear.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Captions' || echo 'WALKTHROUGH menu-Captions: FAIL (tap missed)'
            sleep 3
            adb exec-out screencap -p > 23-section-captions.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Settings' || echo 'WALKTHROUGH menu-Settings: FAIL (tap missed)'
            sleep 3
            adb exec-out screencap -p > 24-section-settings.png
            adb shell input swipe 160 500 160 200 300
            sleep 1
            adb shell input swipe 160 500 160 200 300
            sleep 2
            adb exec-out screencap -p > 25-sheet-scrolled.png
            python3 tools/emulator_tap.py 'Exposure' || echo 'WALKTHROUGH exposure-tile: ABSENT-or-FAIL (tile only exists when EV is supported; see shot 25)'
            sleep 2
            adb exec-out screencap -p > 26-exposure.png
            adb shell input swipe 160 500 160 200 300
            sleep 1
            python3 tools/emulator_tap.py 'Session details' || echo 'WALKTHROUGH session-details-tile: FAIL (tap missed)'
            sleep 2
            adb exec-out screencap -p > 27-session-details.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Start recording'
            sleep 6
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 3
            adb exec-out screencap -p > 04-recording.png
            # SHARE STEP (issues #14 + #50, 2026-11-15): after Stop, the
            # last-video thumbnail appears once _busy clears (the workflow
            # sleeps 8 s below). The persistent Share button is gone
            # (#50) — the new tap sequence is thumbnail ('Last video',
            # the tile's content-desc) -> menu -> 'Share' (now the ONLY
            # 'Share' text node). Tapping 'Last video' IS the thumbnail
            # visibility proof — emulator_tap.py exits 1 when the text is
            # not found. The menu-contents assert then proves Open /
            # Delete / Share are all present; the chooser assert proves
            # the share sheet opened without crashing the app; a target
            # list is NOT required — on a bare emulator image the
            # chooser still opens showing "No apps can perform this
            # action", and that passes. The assert script prints every
            # visible text node so the CI log records the actual target
            # list. This does NOT prove the video was attached (intent
            # resolution matches action + type only, not EXTRA_STREAM) —
            # attachment is proven ONLY by the owner's real-phone test.
            # FALSE-POSITIVE RULE (run 43569645665, #14): the assert used
            # to match the chooser title 'Share video' on the app's OWN
            # Share button (its required semantics label) with no chooser
            # open — so the title only counts off-app (see
            # tools/assert_share_chooser.py). That button is gone in #50,
            # so the false-positive path disappeared with it, but the
            # off-app check stays as belt-and-braces. The app must still
            # be alive after Back dismisses the sheet: that run also
            # showed the app dying in dcr-gl right after Back with no
            # chooser open (Back finished the activity), so the second
            # pidof below guards the dismiss path too.
            # The pidof check proves sharing did not kill the app.
            python3 tools/emulator_tap.py 'Stop recording'
            sleep 8
            adb exec-out screencap -p > 05-after-recording.png
            python3 tools/emulator_tap.py 'Last video'
            sleep 2
            adb exec-out screencap -p > 06-last-video-menu.png
            python3 tools/assert_share_chooser.py --menu
            python3 tools/emulator_tap.py 'Share'
            sleep 5
            adb exec-out screencap -p > 07-share-sheet.png
            python3 tools/assert_share_chooser.py
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            adb shell input keyevent 4
            sleep 1
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            # #82 BEGIN — wide-zoom proof (issue #82): Bali mock location,
            # Settings Map-section slider dragged to its minimum (2.0),
            # then the map circle at the wide zoom. Uses only main-branch
            # helpers (tools/emulator_tap.py text taps + adb).
            # DUMP RULE (run 43810110567): `uiautomator dump` fails with
            # "ERROR: could not get idle state" while the Settings sheet
            # is open (3 attempts over 44 s, no dump file), so the slider
            # is NOT located from a dump — it is dragged by fixed
            # coordinates and verified from the screenshots below.
            # COORDINATES (320x640 emulator): the sheet is 85% tall (top
            # y~117), title row 56, ListView padding 20/8; the Map
            # section above the slider is header 44 + compass label 36 +
            # chips 40 + location switch ~68 + zoom label 36, so the
            # 48-tall slider sits at about y405-453, centre ~429, track
            # x44-276 (20 px sheet padding + 24 px overlay radius each
            # side). Three swipes at y420/435/448 span the slider's
            # height — a swipe that lands on the track drags it to the
            # minimum, the others are no-ops (a horizontal swipe on a
            # label, chip or switch row does nothing, and a bottom sheet
            # only dismisses on a downward drag). Each swipe runs
            # right-to-left from x275 (near max) to x25 (past the track's
            # left edge, so the value clamps at the 2.0 minimum).
            adb emu geo fix 115.3088 -8.4264
            sleep 5
            python3 tools/emulator_tap.py 'Map'
            sleep 3
            adb exec-out screencap -p > 08-settings-map-sheet.png
            adb shell input swipe 275 420 25 420 600
            sleep 1
            adb shell input swipe 275 435 25 435 600
            sleep 1
            adb shell input swipe 275 448 25 448 600
            sleep 2
            adb exec-out screencap -p > 09-zoom-slider-min.png
            adb shell input keyevent 4
            sleep 3
            adb exec-out screencap -p > 10-map-wide-bali.png
            # #82 END
            # VIDEO PROOF (issue #79): the recording path comes from the
            # app's own Session details tile ('Original: <path>'), not
            # from a guessed directory — the file lives in the app cache
            # (DualCamerasPlugin: cacheDir/dcr_<nano>.mp4), so it is
            # pulled with `adb root` + the /sdcard fallback from
            # tools/mapburn_check.py. --video-proof extracts frames at
            # t=1s and t=5s and checks front-vs-rear regions differ in
            # each frame AND each feed's region moves across the two
            # times. It fails loudly: a frozen or single-feed recording
            # is not proof.
            python3 tools/emulator_tap.py 'Settings' || (echo 'VIDEO PROOF FAILED: Settings tap missed - cannot read the recording path'; exit 1)
            sleep 3
            adb shell input swipe 160 500 160 200 300
            sleep 1
            adb shell input swipe 160 500 160 200 300
            sleep 2
            python3 tools/emulator_tap.py 'Session details' || (echo 'VIDEO PROOF FAILED: Session details tile not found - cannot read the recording path'; exit 1)
            sleep 2
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-session.xml
            grep -o 'Original: [^"]*' /tmp/ui-session.xml | head -1 | sed 's/^Original: //' > /tmp/orig-path.txt
            cat /tmp/orig-path.txt
            adb root || true
            adb pull "$(cat /tmp/orig-path.txt)" recorded.mp4 || (adb shell cp "$(cat /tmp/orig-path.txt)" /sdcard/recorded.mp4 && adb pull /sdcard/recorded.mp4 recorded.mp4) || (echo 'VIDEO PROOF FAILED: could not pull the recording'; exit 1)
            ls -la recorded.mp4
            python3 tools/preview_diff.py --video-proof recorded.mp4 --times 1,5 --min-diff 0.1 --min-mean-diff 5.0 || (echo 'VIDEO PROOF FAILED: recorded video frames do not show two different moving feeds'; exit 1)
            echo 'VIDEO PROOF: recorded video frames show two different moving feeds (front circle vs rear area)'
            adb shell input keyevent 4
            sleep 1
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -50 || true
            ls -la *.png *.mp4

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-play-screenshots
          path: |
            *.png
            recorded.mp4
          retention-days: 14
