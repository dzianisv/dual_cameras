# Purpose: capture Play screenshots from real tested flows on the CI
# emulator. Same app, same build as the smoke test — but it taps through
# the camera screen, the Captions sheet, the Filters sheet, and a
# recording, saving one screenshot per step. It does NOT prove concurrent
# cameras, mic audio, or caption inference: emulator cameras are
# virtual, and sherpa-onnx runs through the native bridge. A real phone
# is still the proof gate and the source of the best screenshots (see
# ~/workspace/storycam/PHONE_TEST_PLAN.md).
#
# SHELL RULE (learned the hard way, run 43491636991): the
# android-emulator-runner executes each line of `script:` as a SEPARATE
# `sh -c` call. Variables, functions, and heredocs do NOT survive
# across lines — a variable assigned on one line is empty on the next.
# Every command below is therefore self-contained on one line. Taps go
# through `tools/emulator_tap.py` (a repo file, not inline shell) which
# finds a node by text in `uiautomator dump` output and taps its center.
#
# SCREENSHOT RULE (run 43497670419, 2026-11-14): `adb shell screencap -p
# /sdcard/...` fails with 'Transport endpoint is not connected' — the
# emulator's sdcard is not mounted when the script runs. Screenshots go
# through `adb exec-out screencap -p > file.png`, which streams the PNG
# straight to the host and never touches the device filesystem.
#
# ANR RULE (run 43501670656, 2026-11-14): the launch shot showed a
# "Process system isn't responding" dialog — the SYSTEM process, not
# the app. The emulator has no hardware acceleration and 2 cores, so
# system_server starves during app startup. Dismiss it with a
# best-effort tap on 'Wait' (|| true: absent when no dialog) after
# launch and after starting recording, and give startup 30 s + 15 s
# to settle before the first shot.
#
# HOW TO APPLY: the gh token has `workflow` scope since Den's 2026-11-14
# re-auth (verified by `gh auth status`), so push this file with git
# like any other file. Then dispatch:
#   gh workflow run emulator-screenshots.yml --ref main
# Screenshots land in the `emulator-play-screenshots` artifact
# (14-day retention). Review every screenshot visually before copying
# any of them into docs/play-assets/screenshots/ — a shot with a black
# preview, a cut-off button, or the wrong language is rejected, not
# shipped.
name: StoryCam emulator screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Build release APK (x86_64)
        working-directory: packages/dual_cameras/example
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64

#
# X64 RULE (run 43505361133, 2026-11-14): the release APK is arm64-only,
# and on the x86_64 emulator it runs under ARM translation (libhoudini).
# With no hardware acceleration and 2 cores that starves system_server
# into a persistent "Process system isn't responding" ANR and adb itself
# starts dying (dump killed with 137, daemon connection errors), so the
# 'Wait' tap could not even run and 'Captions' was never found. The
# emulator workflows therefore build an x86_64 APK, which runs natively
# on the x86_64 emulator. The Play release AAB stays arm64 — this build
# is emulator-only. Also give the emulator all 4 host cores and 4 GB RAM.
#
# MACOS RULE — DEAD END (run 43518382001, 2026-11-14): the macOS move
# failed the same way in both jobs. The emulator starts, then dies at
# once: "HVF error: HV_UNSUPPORTED / failed to initialize HVF: Invalid
# argument / QEMU main loop exits abnormally with code 1". The hosted
# macOS runner (macos-26-arm64, MacCloud) is itself a VM with no nested
# virtualization, so Hypervisor.framework is unavailable — there is no
# hardware acceleration on macOS runners either. Do NOT move these
# workflows back to macos-latest.
#
# KVM RULE (runs 43513063175 + 43518382001, 2026-11-14): the Linux
# runner DOES expose /dev/kvm, but the runner user is not in the kvm
# group (run 43513063175: "ProbeKVM: This user doesn't have permissions
# to use KVM (/dev/kvm)", kvm group line ends with no users), so the
# action silently added `-accel off` and the x86_64 emulator ran under
# pure software emulation: ~10 min boot, System UI ANR, adb SIGKILLed.
# Fix: `sudo chmod 666 /dev/kvm` in a step before the emulator step
# (passwordless sudo on hosted runners; mode change takes effect
# immediately, no re-login needed) and `disable-linux-hw-accel: false`
# so the action can never silently fall back to `-accel off` again.
# With KVM the x86_64 emulator boots in ~1-2 min. The 'Wait' taps stay
# as resilience — a slow first boot can still ANR system_server once.
      - name: Enable KVM for the emulator
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          sudo chmod 666 /dev/kvm 2>/dev/null || echo "chmod /dev/kvm skipped"
          ls -l /dev/kvm || true

      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          cores: 4
          ram-size: 4096
          heap-size: 1024
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb install -r packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            adb shell pm grant app.storycam android.permission.CAMERA || true
            adb shell pm grant app.storycam android.permission.RECORD_AUDIO || true
            adb shell am start -n app.storycam/.MainActivity
            sleep 30
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 15
            adb exec-out screencap -p > 01-launch.png
            python3 tools/emulator_tap.py 'Captions'
            sleep 3
            adb exec-out screencap -p > 02-captions-sheet.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Filters'
            sleep 3
            adb exec-out screencap -p > 03-filters.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/emulator_tap.py 'Start recording'
            sleep 6
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 3
            adb exec-out screencap -p > 04-recording.png
            python3 tools/emulator_tap.py 'Stop recording'
            sleep 8
            adb exec-out screencap -p > 05-after-recording.png
            adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -50 || true
            ls -la *.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-play-screenshots
          path: '*.png'
          retention-days: 14
