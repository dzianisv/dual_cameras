name: Publish to Google Play Store

# StoryCam Play publish. Manual dispatch only (no tag trigger): the first
# publish needs a human-created app in Play Console, and every publish
# after that is a deliberate act. Flow per run: internal track first to
# verify the install, then a second dispatch to production (staged).
#
# PROMOTE MODE (run 43867508615 lesson): Play rejects uploading an AAB
# whose version code already exists on another track ("Version code N has
# already been used"), so a production dispatch can NOT re-upload the AAB
# the internal dispatch already published. To move a release between
# tracks, dispatch with promote_from=<source track> (e.g. internal):
# the run skips the build + upload and promotes the source track's
# version codes to `track` at `status`/`user_fraction` via the Android
# Publisher API (tools/promote_play_release.py). Do NOT re-dispatch the
# upload for a version code that is already live on any track.
#
# DRAFT-APP LIMIT (runs 43878320544 + 43878646446, 2026-11-16): while the
# app has never had a production release, the API allows ONLY draft
# releases on it — inProgress fails ("Staged rollout is not permitted
# on draft app") and completed fails ("Only releases with status draft
# may be created on draft app"). So the first production release must be
# created as status=draft via this workflow, and then submitted for
# review in the Play Console UI (a human step — the API cannot submit a
# draft app's first release). After that first publication, staged
# rollouts (inProgress + user_fraction) work normally.
#
# Requires repo secrets:
#   STORYCAM_KEYSTORE_BASE64 / STORYCAM_KEYSTORE_PASSWORD /
#   STORYCAM_KEY_ALIAS / STORYCAM_KEY_PASSWORD — the production upload
#   keystore (Bitwarden Secrets Manager is the source of truth).
#   PLAY_STORE_SERVICE_ACCOUNT_JSON — the VIBE TECHNOLOGIES Play service
#   account (playstore-deploy@opencode-mobile-deploy.iam.gserviceaccount.com,
#   account-level API access already granted). Same account that publishes
#   OpenCode Mobile; it can publish any app under the VIBE developer account.
#
# Unlike build-apk.yml this workflow FAILS if the keystore secrets are
# absent — a Play upload must never be debug-signed.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to release to"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (draft = uploads without going live/review; completed = submit; inProgress/halted = staged rollout at user_fraction)"
        required: false
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      user_fraction:
        description: "Staged-rollout user fraction (0.0-1.0). Used only when status is inProgress or halted."
        required: false
        default: "0.20"
        type: string
      promote_from:
        description: "Promote instead of uploading: source track whose release moves to `track` (internal/alpha/beta). Leave empty to build + upload a fresh AAB."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Concurrent runs for the same ref must not race two uploads into the same
# track. Serialize per ref instead of cancelling, because cancelling
# mid-upload can leave a half-created Play release.
concurrency:
  group: publish-play-store-${{ github.ref }}
  cancel-in-progress: false

env:
  EXAMPLE_DIR: packages/dual_cameras/example

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: ${{ github.event.inputs.promote_from == '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: ${{ github.event.inputs.promote_from == '' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Gradle dependency cache (issue #72): the Flutter build shells out
      # to the Gradle wrapper in packages/dual_cameras/example/android, so
      # Gradle downloads its plugin artifacts (e.g. kotlin-stdlib,
      # kotlin-gradle-plugin) from Maven Central on every run. A 429 from
      # repo.maven.apache.org failed run 43735274382. Cache ~/.gradle so a
      # repeat run reuses the downloaded artifacts instead of re-fetching.
      # actions/cache (not gradle/actions/setup-gradle): setup-gradle
      # expects a top-level Gradle project / wrapper at the repo root and
      # would install its own Gradle distribution; here Gradle is invoked
      # indirectly by Flutter from a nested android/ directory, so cache
      # the dependency + wrapper dirs directly and leave the toolchain
      # Flutter manages untouched.
      - name: Cache Gradle dependencies
        if: ${{ github.event.inputs.promote_from == '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/dual_cameras/example/android/build.gradle.kts', 'packages/dual_cameras/example/android/app/build.gradle.kts', 'packages/dual_cameras/example/android/settings.gradle.kts', 'packages/dual_cameras/example/android/gradle.properties', 'packages/dual_cameras/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch packages
        if: ${{ github.event.inputs.promote_from == '' }}
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter pub get

      - name: Install release keystore from secrets (required)
        if: ${{ github.event.inputs.promote_from == '' }}
        env:
          STORYCAM_KEYSTORE_BASE64: ${{ secrets.STORYCAM_KEYSTORE_BASE64 }}
          STORYCAM_KEYSTORE_PASSWORD: ${{ secrets.STORYCAM_KEYSTORE_PASSWORD }}
          STORYCAM_KEY_ALIAS: ${{ secrets.STORYCAM_KEY_ALIAS }}
          STORYCAM_KEY_PASSWORD: ${{ secrets.STORYCAM_KEY_PASSWORD }}
        run: |
          if [ -z "$STORYCAM_KEYSTORE_BASE64" ]; then
            echo "::error::STORYCAM_KEYSTORE_BASE64 is not set — a Play upload must never be debug-signed."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/storycam-release.keystore"
          printf '%s' "$STORYCAM_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "STORYCAM_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "STORYCAM_KEYSTORE_PASSWORD=$STORYCAM_KEYSTORE_PASSWORD"
            echo "STORYCAM_KEY_ALIAS=$STORYCAM_KEY_ALIAS"
            echo "STORYCAM_KEY_PASSWORD=$STORYCAM_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release app bundle (arm64)
        if: ${{ github.event.inputs.promote_from == '' }}
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build appbundle --release --target-platform android-arm64 --dart-define POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      - name: Verify release-signed AAB
        if: ${{ github.event.inputs.promote_from == '' }}
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/"
          jarsigner -verify -verbose -certs "$AAB" > signing-aab.txt
          grep -q "CN=StoryCam" signing-aab.txt
          if grep -q "CN=Android Debug" signing-aab.txt; then
            echo "FAIL: Play AAB is debug-signed" >&2
            exit 1
          fi
          APP_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          echo "AAB OK: app.storycam ${APP_VERSION} release-signed (CN=StoryCam), $(du -h "$AAB" | cut -f1)"

      - name: Resolve Play track
        id: channel
        run: |
          set -euo pipefail
          TRACK="${{ github.event.inputs.track || 'internal' }}"
          STATUS="${{ github.event.inputs.status || 'completed' }}"
          USER_FRACTION_INPUT="${{ github.event.inputs.user_fraction || '0.20' }}"
          USER_FRACTION=""
          if [ "$STATUS" = "inProgress" ] || [ "$STATUS" = "halted" ]; then
            USER_FRACTION="$USER_FRACTION_INPUT"
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "user_fraction=$USER_FRACTION" >> "$GITHUB_OUTPUT"
          echo "promote_from=${{ github.event.inputs.promote_from }}" >> "$GITHUB_OUTPUT"
          echo "dispatch -> track=$TRACK status=$STATUS user_fraction=${USER_FRACTION:-none} promote_from=${{ github.event.inputs.promote_from || 'none (upload)' }}"

      - name: Publish to Play Store
        if: ${{ github.event.inputs.promote_from == '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.storycam
          releaseFiles: packages/dual_cameras/example/build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.channel.outputs.track }}
          status: ${{ steps.channel.outputs.status }}
          userFraction: ${{ steps.channel.outputs.user_fraction }}
          whatsNewDirectory: distribution/whatsnew

      # Promote mode: move the source track's release to the target track
      # via the Android Publisher API. No build, no upload, no keystore —
      # the version codes already exist, which is exactly why the upload
      # path rejects them (run 43867508615: "Version code 21 has already
      # been used"). The script reads the source track's version codes
      # from Play itself, so the dispatch needs no version input.
      - name: Promote release on Play Store
        if: ${{ github.event.inputs.promote_from != '' }}
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-api-python-client google-auth
          python3 tools/promote_play_release.py \
            --package app.storycam \
            --from-track "${{ github.event.inputs.promote_from }}" \
            --to-track "${{ steps.channel.outputs.track }}" \
            --status "${{ steps.channel.outputs.status }}" \
            --user-fraction "${{ github.event.inputs.user_fraction || '0.20' }}" \
            --whatsnew-dir distribution/whatsnew

      - name: Record where it landed
        if: always()
        run: |
          {
            echo "### Play publish"
            echo ""
            echo "- mode: \`$( [ -n "${{ steps.channel.outputs.promote_from }}" ] && echo "promote from ${{ steps.channel.outputs.promote_from }}" || echo "upload" )\`"
            echo "- track: \`${{ steps.channel.outputs.track }}\`"
            echo "- status: \`${{ steps.channel.outputs.status }}\`"
            echo "- userFraction: \`${{ steps.channel.outputs.user_fraction || 'none' }}\`"
            echo "- version: \`$(sed -n 's/^version: //p' packages/dual_cameras/example/pubspec.yaml)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Always delete the decoded release keystore, even if the build failed.
      - name: Remove release keystore (if installed)
        if: always()
        run: rm -f "$RUNNER_TEMP/storycam-release.keystore"
