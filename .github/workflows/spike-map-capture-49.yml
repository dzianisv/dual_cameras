# Issue #49 SPIKE ONLY (branch spike/map-capture-49, never merge): proves or
# disproves the design §1 capture mechanism — 2 fps RepaintBoundary snapshots
# of the map circle during a 60 s recording at 1080p on the emulator.
# Pass bar (design §1): >=95% of expected snapshots; recorded frame count =
# duration x fps OR zero encoder drops; storage within budget (~100 KB/frame,
# ~12 MB/min). The emulator is the measurement proxy — Den's Pixel 9a is the
# final proof gate. Modeled on emulator-smoke-test.yml: same KVM/x86_64 rules,
# same one-command-per-line script rule (android-emulator-runner executes
# each line as a separate `sh -c`, so no variables/functions/heredocs across
# lines — do not reintroduce them).
name: StoryCam spike — map capture #49

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Analyze
        working-directory: packages/dual_cameras/example
        run: flutter analyze

      - name: Test StoryCam UI and caption downloads
        working-directory: packages/dual_cameras/example
        run: flutter test

      # STORYCAM_ABI=x86_64: the release APK is arm64-only and runs under ARM
      # translation on the x86_64 emulator (starves system_server, adb dies).
      # The emulator build is x86_64-only; the Play release stays arm64.
      - name: Build release APK (x86_64)
        working-directory: packages/dual_cameras/example
        env:
          STORYCAM_ABI: x86_64
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64

      - name: Enable KVM for the emulator
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          sudo chmod 666 /dev/kvm 2>/dev/null || echo "chmod /dev/kvm skipped"
          ls -l /dev/kvm || true

      - name: Emulator spike run (60 s recording)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          cores: 4
          ram-size: 4096
          heap-size: 1024
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb install -r packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            adb shell pm grant app.storycam android.permission.CAMERA || true
            adb shell pm grant app.storycam android.permission.RECORD_AUDIO || true
            adb shell pm grant app.storycam android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant app.storycam android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant app.storycam android.permission.ACCESS_COARSE_LOCATION || true
            adb shell am start -n app.storycam/.MainActivity
            sleep 20
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 5
            python3 tools/emulator_tap.py 'Allow' || true
            sleep 2
            python3 tools/emulator_tap.py 'Open camera' || true
            sleep 20
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > spike-before-rec.png
            python3 tools/emulator_tap.py 'Start recording'
            sleep 60
            python3 tools/emulator_tap.py 'Stop recording'
            sleep 15
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb logcat -d | grep MAPSPIKE > mapspike.log || true
            cat mapspike.log
            adb logcat -d > logcat-full.txt || true
            python3 tools/mapspike_check.py mapspike.log

      - name: Upload spike evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-capture-spike
          path: |
            mapspike.log
            logcat-full.txt
            spike-before-rec.png
          retention-days: 30
