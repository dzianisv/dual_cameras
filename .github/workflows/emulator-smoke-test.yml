# Purpose: best-effort emulator smoke test for the StoryCam APK. It catches
# launch crashes, permission failures, and startup model-download failures — it
# does NOT prove concurrent cameras, mic audio, or caption inference:
# emulator cameras are virtual, ARM translation is involved, and sherpa-onnx
# runs through the native bridge. A real phone is still the proof gate
# (see ~/workspace/storycam/PHONE_TEST_PLAN.md).
#
# BUG FIX 2026-11-14: the first-ever run (43491636991) failed before
# installing the APK — `adb: filename doesn't end .apk or .apex:` with an
# empty filename. Root cause: android-emulator-runner executes each line
# of `script:` as a SEPARATE `sh -c` call, so a variable assigned on one
# line (`APK=...`) does not exist on the next line. Every command below
# is therefore self-contained on one line: no variables, no functions,
# no heredocs across lines. Do not reintroduce multi-line shell
# constructs in this script — they silently do nothing or fail.
#
# SCREENSHOT RULE (run 43497670419, 2026-11-14): `adb shell screencap -p
# /sdcard/...` fails with 'Transport endpoint is not connected' — the
# emulator's sdcard is not mounted when the script runs. Screenshots go
# through `adb exec-out screencap -p > file.png`, which streams the PNG
# straight to the host and never touches the device filesystem.
name: StoryCam emulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Build release APK (arm64)
        working-directory: packages/dual_cameras/example
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            adb install -r packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            adb shell pm grant app.storycam android.permission.CAMERA || true
            adb shell pm grant app.storycam android.permission.RECORD_AUDIO || true
            adb shell am start -n app.storycam/.MainActivity
            sleep 20
            adb exec-out screencap -p > smoke-launch.png
            adb shell dumpsys activity activities | grep -i -A2 -B2 storycam || true
            adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -50 || true

      - name: Upload launch screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-launch
          path: smoke-launch.png
          retention-days: 7
