# Purpose: best-effort emulator smoke test for the StoryCam APK. It catches
# launch crashes, permission failures, and startup model-download failures — it
# does NOT prove concurrent cameras, mic audio, or caption inference:
# emulator cameras are virtual, and sherpa-onnx runs through the native
# bridge. A real phone is still the proof gate
# (see ~/workspace/storycam/PHONE_TEST_PLAN.md).
# It DOES prove the save path: after every recording, tools/longrec_check.py
# asserts the video file EXISTS in MediaStore with duration > 0 (issue #87 —
# 0.5.15 shipped recording no files at all, and the old legs proved only the
# 'Video saved to gallery' status text). The long-recording leg (issue #81,
# LONG-RECORDING LEG below) extends that proof to a 40 s take with map and
# captions on.
#
# BUG FIX 2026-11-14: the first-ever run (43491636991) failed before
# installing the APK — `adb: filename doesn't end .apk or .apex:` with an
# empty filename. Root cause: android-emulator-runner executes each line
# of `script:` as a SEPARATE `sh -c` call, so a variable assigned on one
# line (`APK=...`) does not exist on the next line. Every command below
# is therefore self-contained on one line: no variables, no functions,
# no heredocs across lines. Do not reintroduce multi-line shell
# constructs in this script — they silently do nothing or fail.
#
# LAUNCH-CRASH RULE (run 43528021798, 2026-11-14): run #8 "succeeded"
# while the app had crashed 1 s after launch (no libflutter.so in the
# x86_64 APK — see build.gradle.kts STORYCAM_ABI note). Every check in
# the script was `|| true` except install/start/screencap, so nothing
# noticed the dead process. The script now asserts `pidof app.storycam`
# right after launch and fails fast with a logcat dump when the app is
# not running. Do not soften this check back to `|| true`.
#
# SCREENSHOT RULE (run 43497670419, 2026-11-14): `adb shell screencap -p
# /sdcard/...` fails with 'Transport endpoint is not connected' — the
# emulator's sdcard is not mounted when the script runs. Screenshots go
# through `adb exec-out screencap -p > file.png`, which streams the PNG
# straight to the host and never touches the device filesystem.
#
# RESUME RULE (issue #13, 2026-11-14): after opening the camera, the test
# backgrounds the app (HOME key) and relaunches it, then asserts the
# preview is ALIVE after resume — two screencaps 3 s apart must show MOTION
# in the preview region (tools/preview_diff.py: PIL, preview region
# x40-280/y120-420 in 320x640 coords, per-channel diff threshold 8/255).
# `pidof` alone is NOT enough: run #8 proved a dead app can pass
# pidof-style checks, and a frozen preview keeps the process alive. A
# whole-file `cmp` is NOT enough either: it fails on a status-bar clock
# tick and cannot tell a frozen preview from a live one. The same pair is
# shot BEFORE backgrounding as a pre-check: if the pre-resume pair shows
# no motion, the assertion cannot see motion on this emulator and the run
# fails loudly instead of passing or failing on a meaningless comparison.
# A uiautomator dump asserts the camera screen is still up after resume
# ('Start recording' present). NOTE (issue #46, auto-init): a fresh
# relaunch now re-opens the camera itself, so 'Start recording' alone no
# longer distinguishes a resume from a fresh restart — the motion pair
# below is the real resume signal. The second leg repeats
# the cycle after a finished recording — Den's exact report (0.5.4).
# Thresholds calibrated from repro run 43565398115's artifact (unfixed
# code) plus later live runs: pre-background pairs 8.96% / 3.87% / 0.69% /
# 0.17%, post-resume idle pair 0.44% / 0.63%, post-resume after-recording
# pair 2.19% / 10.76%, cross-leg (~35-40 s) 10.65% / 12.40%, identical
# file vs itself 0.00% (frozen simulation). Every check needs >= 0.1%:
# 1.7x below the smallest live sample (0.17%) while a frozen preview
# scores exactly 0.00%. The live 3 s window varies a lot (the pattern
# moves in bursts), so no threshold above 0.1% is calibrated. See
# tools/preview_diff.py for the full calibration table.
# This test guards "no worse", not "fixed": it passes on unfixed code, and
# Den's phone is the proof gate for the fix.
# Taps reuse tools/emulator_tap.py and the 'Wait'/'Allow' fallbacks from
# emulator-screenshots.yml (same rules: pre-grant POST_NOTIFICATIONS and
# location so the permission dialogs never cover the shutter).
#
# LONG-RECORDING LEG (issues #81 + #87, permanent — runs on EVERY smoke
# run, no dispatch input, so the duration axis stays covered):
# a second emulator step records a 40 s take with map ON and captions ON
# (defaults are map on, captions off — captions are turned on in the
# Settings sheet by tools/enable_captions.py, because _captions is
# in-memory only and camera_settings.json has no captions key, so no
# settings-file preset can enable it). That is the exact stop path that
# can throw before the save (_mapStopCapture() awaited inside the try in
# _stop(), before Gal.putVideo — issue #87).
# Hard gates (the run FAILS on any of these): app alive (pidof) at
# T+10/20/30/35; still recording (Stop button present) at T+30 and T+35;
# no ANR dialog at T+30/T+35; the Stop tap works; the camera screen is
# back after stop; tools/longrec_check.py --label long --pull (STOP line
# >= 30 s with >= 60 snapshots, newest MediaStore video recent with
# duration >= 30 s, no ANR/FATAL line mentions app.storycam, pulled
# video ffprobe-verified >= 30 s). The 6 s leg in the first step gets
# the same MediaStore gate (tools/longrec_check.py --label 6s).
# Motion between the 10 s-apart checkpoints is DIAGNOSTIC ONLY (soft
# || echo): run 43813334501 scored 0.00% on T10-T20 and T30-T35 while
# the preview was live — the emulated pattern moves in bursts. Do not
# hard-gate on it.
# mapburn_check --timeout-secs 180 stays SOFT (|| echo): the emulator's
# decoder cannot run the burn ("yielded no input buffer" -> SKIP), and a
# map-off take queues no burn at all, so it times out — both expected.
# The 6 s leg's mapburn.log is preserved as mapburn-6s.log before it.
# Investigation verdict (context pack comment 6907461437): NOT reproduced
# in the emulator — 6 takes, ~325 s, zero freezes, all CI runs success.
# No root cause exists to fix, so this leg adds coverage + the _mapTick
# instrumentation instead; issue #81 stays OPEN, gated on a phone-side
# repro. #87 owns the root-cause fix for the missing files; this leg is
# one of the gates that must prove it.
name: StoryCam emulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # STORYCAM_ABI=x86_64: build.gradle.kts strips every ABI except the
      # target one — without this the x86_64 APK ships with NO native libs
      # and crashes on launch ("Could not find 'libflutter.so'", run
      # 43528021798). The Play release build (build-apk.yml) leaves the
      # var unset and stays arm64-v8a.
      - name: Build release APK (x86_64)
        working-directory: packages/dual_cameras/example
        env:
          STORYCAM_ABI: x86_64
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64

#
# X64 RULE (run 43505361133, 2026-11-14): the release APK is arm64-only,
# and on the x86_64 emulator it runs under ARM translation (libhoudini).
# With no hardware acceleration and 2 cores that starves system_server
# into a persistent "Process system isn't responding" ANR and adb itself
# starts dying (dump killed with 137, daemon connection errors), so the
# 'Wait' tap could not even run and 'Captions' was never found. The
# emulator workflows therefore build an x86_64 APK, which runs natively
# on the x86_64 emulator. The Play release AAB stays arm64 — this build
# is emulator-only. Also give the emulator all 4 host cores and 4 GB RAM.
#
# MACOS RULE — DEAD END (run 43518382001, 2026-11-14): the macOS move
# failed the same way in both jobs. The emulator starts, then dies at
# once: "HVF error: HV_UNSUPPORTED / failed to initialize HVF: Invalid
# argument / QEMU main loop exits abnormally with code 1". The hosted
# macOS runner (macos-26-arm64, MacCloud) is itself a VM with no nested
# virtualization, so Hypervisor.framework is unavailable — there is no
# hardware acceleration on macOS runners either. Do NOT move these
# workflows back to macos-latest.
#
# KVM RULE (runs 43513063175 + 43518382001, 2026-11-14): the Linux
# runner DOES expose /dev/kvm, but the runner user is not in the kvm
# group (run 43513063175: "ProbeKVM: This user doesn't have permissions
# to use KVM (/dev/kvm)", kvm group line ends with no users), so the
# action silently added `-accel off` and the x86_64 emulator ran under
# pure software emulation: ~10 min boot, System UI ANR, adb SIGKILLed.
# Fix: `sudo chmod 666 /dev/kvm` in a step before the emulator step
# (passwordless sudo on hosted runners; mode change takes effect
# immediately, no re-login needed) and `disable-linux-hw-accel: false`
# so the action can never silently fall back to `-accel off` again.
# With KVM the x86_64 emulator boots in ~1-2 min.
      - name: Enable KVM for the emulator
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          sudo chmod 666 /dev/kvm 2>/dev/null || echo "chmod /dev/kvm skipped"
          ls -l /dev/kvm || true

      # Pillow is needed by tools/preview_diff.py (region-aware preview
      # liveness check, issue #13) and tools/mapburn_check.py (issue #49
      # map-burn pixel check); imageio-ffmpeg provides the static ffmpeg
      # binary the map-burn check extracts frames with. Neither is
      # preinstalled on the runner.
      - name: Install Pillow + imageio-ffmpeg for the image checks
        run: python3 -m pip install --quiet pillow imageio-ffmpeg

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          cores: 4
          ram-size: 4096
          heap-size: 1024
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb install -r packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            adb shell pm grant app.storycam android.permission.CAMERA || true
            adb shell pm grant app.storycam android.permission.RECORD_AUDIO || true
            adb shell pm grant app.storycam android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant app.storycam android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant app.storycam android.permission.ACCESS_COARSE_LOCATION || true
            adb shell am start -n app.storycam/.MainActivity
            sleep 20
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > smoke-launch.png
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 5
            python3 tools/emulator_tap.py 'Allow' || true
            sleep 2
            python3 tools/emulator_tap.py 'Open camera' || true
            sleep 20
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > resume-pre-1.png
            sleep 3
            adb exec-out screencap -p > resume-pre-2.png
            python3 tools/preview_diff.py resume-pre-1.png resume-pre-2.png --min-diff 0.1 || (echo 'PRE-CHECK FAILED: no motion in the preview region before backgrounding - the live-preview assertion cannot see motion on this emulator'; exit 1)
            echo 'pre-check: preview region shows motion (live preview before background)'
            adb shell input keyevent 3
            sleep 5
            adb shell am start -n app.storycam/.MainActivity
            sleep 10
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-resume.xml
            grep -q 'Start recording' /tmp/ui-resume.xml || (echo 'NOT ON CAMERA SCREEN AFTER RESUME: no Start recording button - app may have restarted fresh instead of resuming'; exit 1)
            adb exec-out screencap -p > resume-after-1.png
            sleep 3
            adb exec-out screencap -p > resume-after-2.png
            python3 tools/preview_diff.py resume-after-1.png resume-after-2.png --min-diff 0.1 || (echo 'RESUME FAILED (idle): no motion in the preview region after background/foreground - camera frozen (issue #13)'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            echo 'resume (idle): preview region shows motion after background/foreground (live preview restored)'
            python3 tools/emulator_tap.py 'Start recording'
            sleep 6
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 3
            python3 tools/emulator_tap.py 'Stop recording'
            sleep 8
            # Issue #87: the 6 s take must ALSO leave a file in MediaStore —
            # the status text alone shipped 0.5.15 with no files at all.
            python3 tools/longrec_check.py --min-duration-secs 5 --min-captured 5 --label 6s || (echo 'MEDIASTORE CHECK FAILED (6s take, issue #87): no video file in MediaStore — see longrec-check-6s.log'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            python3 tools/mapburn_check.py || (echo 'MAP BURN FAILED (issue #49): see mapburn.log + the MAPBURN logcat lines below'; adb logcat -d | grep -i -E "MAPBURN|CaptionBurner|MapRenderer" | tail -40 || true; exit 1)
            echo 'map burn (issue #49): burned video carries the map top-left'
            adb shell input keyevent 3
            sleep 5
            adb shell am start -n app.storycam/.MainActivity
            sleep 10
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-resume2.xml
            grep -q 'Start recording' /tmp/ui-resume2.xml || (echo 'NOT ON CAMERA SCREEN AFTER RESUME (after recording): no Start recording button - app may have restarted fresh instead of resuming'; exit 1)
            adb exec-out screencap -p > resume-after-rec-1.png
            sleep 3
            adb exec-out screencap -p > resume-after-rec-2.png
            python3 tools/preview_diff.py resume-after-rec-1.png resume-after-rec-2.png --min-diff 0.1 || (echo 'RESUME FAILED (after recording): no motion in the preview region after background/foreground - camera frozen (issue #13)'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            echo 'resume (after recording): preview region shows motion after background/foreground (live preview restored)'
            adb shell dumpsys activity activities | grep -i -A2 -B2 storycam || true
            adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -50 || true
            
      - name: 'Emulator long recording leg (#81 + #87, permanent)'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          cores: 4
          ram-size: 4096
          heap-size: 1024
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb install -r packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            adb shell pm grant app.storycam android.permission.CAMERA || true
            adb shell pm grant app.storycam android.permission.RECORD_AUDIO || true
            adb shell pm grant app.storycam android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant app.storycam android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant app.storycam android.permission.ACCESS_COARSE_LOCATION || true
            adb shell am start -n app.storycam/.MainActivity
            sleep 20
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-launch.png
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 5
            python3 tools/emulator_tap.py 'Allow' || true
            sleep 2
            python3 tools/emulator_tap.py 'Open camera' || true
            sleep 20
            adb shell pidof app.storycam || (adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-ready.png
            python3 tools/emulator_tap.py 'Captions'
            sleep 5
            python3 tools/enable_captions.py || (echo 'CAPTIONS SETUP FAILED (issue #86?): Auto-captions could not be turned on — the long leg cannot run its map+captions stop path'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-preset.xml
            cp /tmp/ui-preset.xml ui-preset.xml || true
            adb shell input keyevent 4
            sleep 2
            date -u '+LONGREC START %Y-%m-%dT%H:%M:%SZ'
            python3 tools/emulator_tap.py 'Start recording'
            sleep 10
            date -u '+LONGREC CHECKPOINT T+10s %Y-%m-%dT%H:%M:%SZ'
            adb shell pidof app.storycam && echo 'T+10: APP ALIVE' || (echo 'T+10: APP DEAD (pidof empty) — issue #81 lock?'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-t10.png
            python3 tools/emulator_tap.py 'Wait' || true
            sleep 10
            date -u '+LONGREC CHECKPOINT T+20s %Y-%m-%dT%H:%M:%SZ'
            adb shell pidof app.storycam && echo 'T+20: APP ALIVE' || (echo 'T+20: APP DEAD (pidof empty) — issue #81 lock?'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-t20.png
            sleep 10
            date -u '+LONGREC CHECKPOINT T+30s %Y-%m-%dT%H:%M:%SZ'
            adb shell pidof app.storycam && echo 'T+30: APP ALIVE' || (echo 'T+30: APP DEAD (pidof empty) — issue #81 lock?'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-t30.png
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-30s.xml
            cp /tmp/ui-30s.xml ui-30s.xml || true
            grep -q 'Stop recording' /tmp/ui-30s.xml || (echo 'T+30: NOT RECORDING (no Stop button — take stopped early or UI frozen, issue #81)'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            echo 'T+30: STILL RECORDING (Stop button present)'
            if grep -q -i 'responding' /tmp/ui-30s.xml; then echo 'T+30: ANR DIALOG PRESENT — app locked (issue #81)'; adb logcat -d | grep -i -E "ANR|not responding" | tail -20; exit 1; fi
            sleep 5
            date -u '+LONGREC CHECKPOINT T+35s %Y-%m-%dT%H:%M:%SZ'
            adb shell pidof app.storycam && echo 'T+35: APP ALIVE' || (echo 'T+35: APP DEAD (pidof empty) — issue #81 lock?'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-t35.png
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-35s.xml
            cp /tmp/ui-35s.xml ui-35s.xml || true
            grep -q 'Stop recording' /tmp/ui-35s.xml || (echo 'T+35: NOT RECORDING (no Stop button — take stopped early or UI frozen, issue #81)'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; exit 1)
            echo 'T+35: STILL RECORDING (Stop button present)'
            if grep -q -i 'responding' /tmp/ui-35s.xml; then echo 'T+35: ANR DIALOG PRESENT — app locked (issue #81)'; adb logcat -d | grep -i -E "ANR|not responding" | tail -20; exit 1; fi
            sleep 5
            date -u '+LONGREC STOP TAP ~T+40s %Y-%m-%dT%H:%M:%SZ'
            timeout 120 python3 tools/emulator_tap.py 'Stop recording' || (echo 'STOP TAP FAILED (issue #81): Stop button absent or tap failed — UI may be frozen'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            echo 'STOP TAP: tapped'
            sleep 15
            adb shell pidof app.storycam && echo 'AFTER-STOP: APP ALIVE' || (echo 'AFTER-STOP: APP DEAD (pidof empty)'; adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -30; adb logcat -d -b crash | tail -40 || true; exit 1)
            adb exec-out screencap -p > longrec-after-stop.png
            adb shell uiautomator dump /data/local/tmp/ui.xml
            adb pull /data/local/tmp/ui.xml /tmp/ui-after-stop.xml
            cp /tmp/ui-after-stop.xml ui-after-stop.xml || true
            grep -q 'Start recording' /tmp/ui-after-stop.xml || (echo 'AFTER-STOP: NOT ON CAMERA SCREEN (no Start recording — UI may be stuck on the stop/burn path)'; exit 1)
            echo 'AFTER-STOP: CAMERA SCREEN BACK (Start recording present — UI responsive after stop)'
            python3 tools/preview_diff.py longrec-t10.png longrec-t20.png --min-diff 0.1 || echo 'MOTION T10-T20: 0.00% or below threshold (diagnostic only — 10 s windows score 0.00% on live previews, see header)'
            python3 tools/preview_diff.py longrec-t20.png longrec-t30.png --min-diff 0.1 || echo 'MOTION T20-T30: 0.00% or below threshold (diagnostic only — 10 s windows score 0.00% on live previews, see header)'
            python3 tools/preview_diff.py longrec-t30.png longrec-t35.png --min-diff 0.1 || echo 'MOTION T30-T35: 0.00% or below threshold (diagnostic only — 10 s windows score 0.00% on live previews, see header)'
            adb logcat -d > logcat-full.txt
            adb logcat -d | grep -i -E "storycam|flutter|fatal|crash" | tail -100 > logcat-storycam.txt || true
            adb logcat -d | grep -i -E "MAPBURN|CaptionBurner|MapRenderer" | tail -60 > logcat-mapburn.txt || true
            adb logcat -d | grep -i -E "ANR|not responding|OutOfMemory|thermal|MediaCodec|MediaMuxer" | tail -60 > logcat-anr.txt || true
            adb logcat -d -b crash > logcat-crash.txt || true
            adb shell dumpsys meminfo app.storycam > meminfo.txt || true
            adb shell dumpsys activity activities > dumpsys-activities.txt || true
            cp mapburn.log mapburn-6s.log || true
            python3 tools/mapburn_check.py --timeout-secs 180 || echo 'MAPBURN CHECK (long take): non-zero exit — expected on the emulator (decoder cannot run the burn) or when no burn was queued; the hard gates are the checkpoints + longrec_check below'
            python3 tools/longrec_check.py --min-duration-secs 30 --min-captured 60 --label long --pull || (echo 'LONGREC CHECK FAILED (issues #81/#87): see longrec-check-long.log'; exit 1)
            echo 'LONGREC LEG DONE — 40 s take with map+captions on, app alive past 30 s, video in MediaStore and ffprobe-valid'

      - name: Upload launch screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-launch
          path: |
            smoke-launch.png
            resume-pre-*.png
            resume-after-*.png
            mapburn.log
            mapburn-original.png
            mapburn-burned.png
            mapburn-original.mp4
            mapburn-burned.mp4
            longrec-*.png
            logcat-full.txt
            logcat-storycam.txt
            logcat-mapburn.txt
            logcat-anr.txt
            logcat-crash.txt
