name: Build StoryCam APK

# Manual builds produce a downloadable APK workflow artifact.
# Existing v* tag builds additionally retain their GitHub Release behavior.
# (The sandbox VM cannot run Gradle: Java TCP is blocked there — CI is the
# canonical build path.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  EXAMPLE_DIR: packages/dual_cameras/example

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Gradle dependency cache (issue #72): the Flutter build shells out
      # to the Gradle wrapper in packages/dual_cameras/example/android, so
      # Gradle downloads its plugin artifacts (e.g. kotlin-stdlib,
      # kotlin-gradle-plugin) from Maven Central on every run. A 429 from
      # repo.maven.apache.org failed run 43735274382. Cache ~/.gradle so a
      # repeat run reuses the downloaded artifacts instead of re-fetching.
      # actions/cache (not gradle/actions/setup-gradle): setup-gradle
      # expects a top-level Gradle project / wrapper at the repo root and
      # would install its own Gradle distribution; here Gradle is invoked
      # indirectly by Flutter from a nested android/ directory, so cache
      # the dependency + wrapper dirs directly and leave the toolchain
      # Flutter manages untouched.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/dual_cameras/example/android/build.gradle.kts', 'packages/dual_cameras/example/android/app/build.gradle.kts', 'packages/dual_cameras/example/android/settings.gradle.kts', 'packages/dual_cameras/example/android/gradle.properties', 'packages/dual_cameras/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch packages
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter analyze

      - name: Test StoryCam UI and caption downloads
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter test

      - name: Test camera controller
        working-directory: packages/dual_cameras
        run: |
          flutter pub get
          flutter test

      # The example's release buildType signs with the debug key (stock Flutter
      # template default) until the upload keystore is supplied (issue #32) —
      # the APK is sideload-installable, but it is still debug-signed.
      # Reinstall (don't update) once a properly-signed build ships.
      # Release keystore delivery (issue #32): when Den supplies the upload
      # keystore as the STORYCAM_KEYSTORE_BASE64 secret (plus the three
      # STORYCAM_* password/alias secrets), decode it outside the repo and
      # hand the four env vars to the Gradle signing config. Until then the
      # secrets are unset, this step exits early, and the build takes the
      # debug fallback. No secret value is ever echoed: the values travel
      # only through env vars and $GITHUB_ENV (GitHub masks secrets in logs).
      # NOTE: `secrets` cannot be referenced in a step `if:` (GitHub
      # rejects the workflow at parse time), so the presence check lives
      # in the shell below: an unset secret arrives as an empty env var
      # and the step exits early, leaving the debug fallback in place.
      # NOTE: the "Verify StoryCam APK" step's signing assertion is
      # conditional on the signing path (made conditional when the
      # keystore first activated): a release-signed tag build asserts
      # NOT debug-signed, a build without the keystore asserts debug.
      - name: Install release keystore from secrets (if provided)
        env:
          STORYCAM_KEYSTORE_BASE64: ${{ secrets.STORYCAM_KEYSTORE_BASE64 }}
          STORYCAM_KEYSTORE_PASSWORD: ${{ secrets.STORYCAM_KEYSTORE_PASSWORD }}
          STORYCAM_KEY_ALIAS: ${{ secrets.STORYCAM_KEY_ALIAS }}
          STORYCAM_KEY_PASSWORD: ${{ secrets.STORYCAM_KEY_PASSWORD }}
        run: |
          if [ -z "$STORYCAM_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret set; using the debug fallback."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/storycam-release.keystore"
          printf '%s' "$STORYCAM_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "STORYCAM_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "STORYCAM_KEYSTORE_PASSWORD=$STORYCAM_KEYSTORE_PASSWORD"
            echo "STORYCAM_KEY_ALIAS=$STORYCAM_KEY_ALIAS"
            echo "STORYCAM_KEY_PASSWORD=$STORYCAM_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      # Play requires AAB for new apps: built alongside the APK (which stays
      # the sideload test artifact). Same debug signing as the APK for now;
      # a production-signed AAB ships with the Play submission.
      - name: Build release app bundle (arm64)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build appbundle --release --target-platform android-arm64 --dart-define POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      - name: Verify StoryCam APK and test signing
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -q "package: name='app.storycam'" badging.txt
          grep -q "android.permission.CAMERA" badging.txt
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          grep -q "android.permission.INTERNET" badging.txt
          grep -q "application-label:'StoryCam'" badging.txt
          APP_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          grep -q "versionCode='${APP_VERSION#*+}'" badging.txt
          grep -q "versionName='${APP_VERSION%+*}'" badging.txt
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${APP_VERSION%+*}"
          fi
          "$(dirname "$AAPT2")/apksigner" verify --verbose --print-certs "$APK" > signing.txt
          # Signing assertion is conditional on the signing path (issue #32
          # follow-up): a release-keystore build must NOT be debug-signed,
          # a build without the keystore must be debug-signed.
          if [ -n "$STORYCAM_KEYSTORE_FILE" ]; then
            if grep -q "CN=Android Debug" signing.txt; then
              echo "FAIL: release-keystore build is debug-signed" >&2
              exit 1
            fi
            echo "APK OK: StoryCam + package + CAMERA, RECORD_AUDIO, INTERNET + release certificate"
          else
            grep -q "CN=Android Debug" signing.txt
            echo "APK OK: StoryCam + package + CAMERA, RECORD_AUDIO, INTERNET + debug certificate"
          fi

      - name: Verify StoryCam app bundle
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q "app.storycam"
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/"
          echo "AAB OK: app.storycam + arm64-v8a, $(du -h "$AAB" | cut -f1)"

      # APK asset name is storycam-<version>-arm64.apk (versionName from
      # pubspec.yaml). The static paths below name 0.5.16 literally — on a
      # version bump, update them here, in the release files list, and in
      # website/latest.html, exactly as the release checklist already does.
      - name: Prepare APK artifact
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          APP_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          APK_NAME="storycam-${APP_VERSION%+*}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS
          cp build/app/outputs/bundle/release/app-release.aab storycam-play-release.aab
          sha256sum storycam-play-release.aab > SHA256SUMS.aab
          if [ -n "$STORYCAM_KEYSTORE_FILE" ]; then SIGNING=release; else SIGNING=debug; fi
          printf 'commit=%s\nref=%s\nsigning=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$SIGNING" > build-info.txt

      - name: Upload StoryCam APK
        uses: actions/upload-artifact@v4
        with:
          name: storycam-0.5.16-arm64-${{ github.sha }}
          path: |
            packages/dual_cameras/example/storycam-0.5.16-arm64.apk
            packages/dual_cameras/example/SHA256SUMS
            packages/dual_cameras/example/storycam-play-release.aab
            packages/dual_cameras/example/SHA256SUMS.aab
            packages/dual_cameras/example/build-info.txt
            packages/dual_cameras/example/badging.txt
            packages/dual_cameras/example/signing.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: '${{ github.ref_name }} - StoryCam'
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            packages/dual_cameras/example/storycam-0.5.16-arm64.apk
            packages/dual_cameras/example/SHA256SUMS
            packages/dual_cameras/example/build-info.txt
          body: |
            ## What's new in 0.5.16

            - Recording fixed: stopping a recording now always saves the video file — a map step can no longer eat it (#87).
            - Map zooms out far enough to see the whole island (#82).
            - The blue triangle on the map is gone (#83).
            - Long recordings: a 40-second test now runs on every build, and the map picture step is timed (#81).

            ## StoryCam ${{ github.ref_name }}

            Android ARM64 build with the StoryCam capture interface and
            multilingual on-device captions. Records the front and back cameras
            together in one portrait video, with live exposure and filter controls.

            ### Captions in this build
            - Multilingual Whisper base model with automatic language detection —
              Russian and English verified on host with real speech; the detected
              language is shown when captions finish.
            - Caption language setting (Auto / Русский / English) in the Captions
              sheet, saved between sessions. Auto is the default. Single words are
              the hardest case for automatic detection, so force a language for
              short clips instead of guessing.
            - Model download and caption processing both show as system notifications with a progress bar and a Stop button that really cancels the work: stopping a download aborts it, stopping captioning abandons the job and keeps the original video. No processing status shows inside the app.
            - Recording can't get stuck the same way: camera commands time out after 20 s with an error instead of a dead button, and a tap on the shutter while the camera is busy queues up and fires once it frees.
            - Captions run in the foreground on Android. Silero VAD gates captions
              to detected speech: silence and noise produce no captions, and the
              karaoke highlight stops during pauses.
            - Word timings are validated against the audio duration before burn-in.
            - Model files are verified by size and SHA-256 after download and on every
              cache hit; a mismatch is discarded and re-downloaded, never trusted.
            - Caption-model download progress, retry and recovery from incomplete caches (shown in the notification, not in the app).
            - The original video is kept, and the next recording does not wait for
              caption processing.

            ### Install
            1. Download `storycam-0.5.16-arm64.apk` below.
            2. Sideload it (allow "install unknown apps" when prompted).
            3. Open StoryCam, grant Camera and Microphone, then use the shutter
               to open the camera and start or stop recording.

            ### Requirements
            - An ARM64 Android phone with concurrent front and back camera support.
            - The caption models download about 160 MB on first use (multilingual
              Whisper base int8 + Silero VAD). Camera capture remains available while
              they download.

            ### Verification and limitations
            CI runs analysis, UI/caption/controller tests, a host inference check that
            decodes real Russian speech with the exact model files (words, detected
            language, timestamps, silence/noise rejection), and verifies the APK's
            package, version, permissions and signature before publication.
            **This build has not been tested on a physical phone.** Real capture,
            gallery saving, audio sync, GPU performance and native caption inference
            still need device testing. Launcher artwork is unchanged. A stop tapped during the transcribe step itself takes effect after that step finishes, before burn-in — the decode can't be interrupted mid-word — but no captioned video is ever saved after a stop.

            This APK is signed with the production upload key (CN=StoryCam).
            It cannot update a build signed with a different key in place — if you
            have an older debug-signed build installed, uninstall it first (back up
            anything needed; uninstalling removes app-local data). The matching
            production-signed AAB is the Play upload candidate.

      # Always delete the decoded release keystore, even if the build failed.
      - name: Remove release keystore (if installed)
        if: always()
        run: rm -f "$RUNNER_TEMP/storycam-release.keystore"

  # CI proof for the release signing wiring (issue #32): builds the release
  # AAB + APK with a CI-generated throwaway keystore and asserts the
  # signature is the throwaway cert, not the debug key. Separate from the
  # tag job on purpose — the tag job's artifacts are the published release
  # and must stay debug-signed until Den supplies the real keystore.
  # Runs on workflow_dispatch (this workflow has no pull_request trigger)
  # and publishes nothing on any ref: it uploads only a workflow artifact.
  # The throwaway key must never be enrolled as the Play upload key.
  prove-release-signing:
    runs-on: ubuntu-latest
    # Fixed throwaway credentials for a keystore that is generated fresh
    # every run and deleted at job end — these are NOT secrets (same
    # standing as the Android debug keystore's public password "android").
    env:
      STORYCAM_KEY_ALIAS: storycam-ci-proof
      STORYCAM_KEYSTORE_PASSWORD: storycam-ci-proof
      STORYCAM_KEY_PASSWORD: storycam-ci-proof
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Gradle dependency cache (issue #72): the Flutter build shells out
      # to the Gradle wrapper in packages/dual_cameras/example/android, so
      # Gradle downloads its plugin artifacts (e.g. kotlin-stdlib,
      # kotlin-gradle-plugin) from Maven Central on every run. A 429 from
      # repo.maven.apache.org failed run 43735274382. Cache ~/.gradle so a
      # repeat run reuses the downloaded artifacts instead of re-fetching.
      # actions/cache (not gradle/actions/setup-gradle): setup-gradle
      # expects a top-level Gradle project / wrapper at the repo root and
      # would install its own Gradle distribution; here Gradle is invoked
      # indirectly by Flutter from a nested android/ directory, so cache
      # the dependency + wrapper dirs directly and leave the toolchain
      # Flutter manages untouched.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/dual_cameras/example/android/build.gradle.kts', 'packages/dual_cameras/example/android/app/build.gradle.kts', 'packages/dual_cameras/example/android/settings.gradle.kts', 'packages/dual_cameras/example/android/gradle.properties', 'packages/dual_cameras/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch packages
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter pub get

      - name: Generate throwaway release keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/storycam-ci-proof.keystore"
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -alias "$STORYCAM_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=StoryCam CI Proof, OU=CI, O=StoryCam, C=US" \
            -storepass:env STORYCAM_KEYSTORE_PASSWORD -keypass:env STORYCAM_KEY_PASSWORD
          echo "STORYCAM_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release app bundle with throwaway keystore
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build appbundle --release --target-platform android-arm64 --dart-define POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      - name: Build release APK with throwaway keystore
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      - name: Verify throwaway-keystore signing
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$(dirname "$AAPT2")/apksigner" verify --verbose --print-certs "$APK" > signing-proof.txt
          grep -q "CN=StoryCam CI Proof" signing-proof.txt
          if grep -q "CN=Android Debug" signing-proof.txt; then
            echo "FAIL: proof APK is debug-signed" >&2
            exit 1
          fi
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > signing-proof-aab.txt
          grep -q "CN=StoryCam CI Proof" signing-proof-aab.txt
          if grep -q "CN=Android Debug" signing-proof-aab.txt; then
            echo "FAIL: proof AAB is debug-signed" >&2
            exit 1
          fi
          echo "Proof OK: APK + AAB signed with CN=StoryCam CI Proof, not Android Debug"

      - name: Record proof build info
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          printf 'commit=%s\nref=%s\nsigning=release (throwaway CI key)\n' "$GITHUB_SHA" "$GITHUB_REF" > build-info.txt

      - name: Upload signing proof
        uses: actions/upload-artifact@v4
        with:
          name: storycam-signing-proof-${{ github.sha }}
          path: |
            packages/dual_cameras/example/build/app/outputs/flutter-apk/app-release.apk
            packages/dual_cameras/example/build/app/outputs/bundle/release/app-release.aab
            packages/dual_cameras/example/signing-proof.txt
            packages/dual_cameras/example/signing-proof-aab.txt
            packages/dual_cameras/example/build-info.txt
          if-no-files-found: error
          retention-days: 7

      # Always delete the throwaway keystore, even if the build failed.
      - name: Delete throwaway keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/storycam-ci-proof.keystore"
