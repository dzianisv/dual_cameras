name: Build StoryCam APK

# Manual builds produce a downloadable test APK workflow artifact.
# Existing v* tag builds additionally retain their GitHub Release behavior.
# (The sandbox VM cannot run Gradle: Java TCP is blocked there — CI is the
# canonical build path.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  EXAMPLE_DIR: packages/dual_cameras/example

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter analyze

      - name: Test StoryCam UI and caption downloads
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter test

      - name: Test camera controller
        working-directory: packages/dual_cameras
        run: |
          flutter pub get
          flutter test

      # The example's release buildType signs with the debug key (stock Flutter
      # template default) — the APK is sideload-installable, but it is a TEST
      # build. Reinstall (don't update) once a properly-signed build ships.
      - name: Build release APK (arm64)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify StoryCam APK and test signing
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -q "package: name='com.romanslack.dual_cameras_example'" badging.txt
          grep -q "android.permission.CAMERA" badging.txt
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          grep -q "android.permission.INTERNET" badging.txt
          grep -q "application-label:'StoryCam'" badging.txt
          APP_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          grep -q "versionCode='${APP_VERSION#*+}'" badging.txt
          grep -q "versionName='${APP_VERSION%+*}'" badging.txt
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${APP_VERSION%+*}"
          fi
          "$(dirname "$AAPT2")/apksigner" verify --verbose --print-certs "$APK" > signing.txt
          grep -q "CN=Android Debug" signing.txt
          echo "APK OK: StoryCam + package + CAMERA, RECORD_AUDIO, INTERNET + debug certificate"

      - name: Prepare APK artifact
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk storycam-test-arm64.apk
          sha256sum storycam-test-arm64.apk > SHA256SUMS
          printf 'commit=%s\nref=%s\nsigning=debug test key\n' "$GITHUB_SHA" "$GITHUB_REF" > build-info.txt

      - name: Upload StoryCam test APK
        uses: actions/upload-artifact@v4
        with:
          name: storycam-test-arm64-${{ github.sha }}
          path: |
            packages/dual_cameras/example/storycam-test-arm64.apk
            packages/dual_cameras/example/SHA256SUMS
            packages/dual_cameras/example/build-info.txt
            packages/dual_cameras/example/badging.txt
            packages/dual_cameras/example/signing.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: '${{ github.ref_name }} - StoryCam test release'
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            packages/dual_cameras/example/storycam-test-arm64.apk
            packages/dual_cameras/example/SHA256SUMS
            packages/dual_cameras/example/build-info.txt
          body: |
            ## StoryCam ${{ github.ref_name }} test release

            Android ARM64 test build with the StoryCam capture interface and
            fixes for caption-model downloads. Records the front and back cameras
            together in one portrait video, with live exposure and filter controls.

            ### Changes since v0.3.0
            - Redesigned camera controls with a full 9:16 preview, responsive
              layouts and accessible labels.
            - Fixed Internet permission for caption-model downloads in release builds.
            - Caption-model startup progress, retry and recovery from incomplete caches.
            - Queued captions run independently of capture. The original video is
              kept, and the next recording does not wait for caption processing.
            - Live exposure controls and still capture while recording.

            ### Install
            1. Download `storycam-test-arm64.apk` below.
            2. Sideload it (allow "install unknown apps" when prompted).
            3. Open StoryCam, grant Camera and Microphone, then use the shutter
               to open the camera and start or stop recording.

            ### Requirements
            - An ARM64 Android phone with concurrent front and back camera support.
            - The caption model downloads about 100 MB on first use. Camera capture
              remains available while it downloads.

            ### Verification and limitations
            CI runs analysis, UI/caption/controller tests, and verifies the APK's
            package, version, permissions and signature before publication.
            **This build has not been tested on a physical phone.** Real capture,
            gallery saving, audio sync, GPU performance and native caption inference
            still need device testing. Launcher artwork is unchanged.

            This APK uses a **debug test signing key**, not a production key.
            Android may reject updating another test build signed with a different
            key. If so, back up anything needed before uninstalling the old app;
            uninstalling removes app-local data. A future production-signed build
            will also require reinstalling.
