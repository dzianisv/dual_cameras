name: dual_cameras_example
description: "Demonstrates dual_cameras: front+back simultaneous capture."
publish_to: 'none'
version: 0.5.6+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dual_cameras:
    path: ../
  permission_handler: ^11.3.1
  gal: ^2.3.0
  # Map & compass camera screen (issue #20): live map circle, location,
  # compass. flutter_map renders OpenStreetMap raster tiles (no key);
  # geolocator streams the position, flutter_compass the heading.
  flutter_map: ^8.3.2
  latlong2: ^0.9.0
  geolocator: ^14.1.2
  flutter_compass: ^0.8.0
  # Auto-captions (v0.2.0): on-device STT via sherpa-onnx (native libs ship
  # per-ABI through the sherpa_onnx_android_* packages).
  sherpa_onnx: ^2.0.1
  http: ^1.0.0
  # SHA-256 verification of downloaded model files.
  crypto: ^3.0.0
  path_provider: ^2.1.0
  # Caption-model download progress lives in a system notification
  # (v0.5.2), not as a banner on the camera screen.
  flutter_local_notifications: ^19.0.0
  # Crash reporting (Sentry). The DSN is read from --dart-define
  # SENTRY_DSN at build time and never committed; with no DSN the
  # integration is fully disabled (see lib/crash_reporting.dart).
  sentry_flutter: ^9.30.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dual_cameras_platform_interface:
    path: ../../dual_cameras_platform_interface
  plugin_platform_interface: ^2.1.8

# The federated packages aren't published yet — resolve them locally.
dependency_overrides:
  dual_cameras:
    path: ../
  dual_cameras_platform_interface:
    path: ../../dual_cameras_platform_interface
  dual_cameras_android:
    path: ../../dual_cameras_android
  dual_cameras_ios:
    path: ../../dual_cameras_ios

flutter:
  uses-material-design: true
