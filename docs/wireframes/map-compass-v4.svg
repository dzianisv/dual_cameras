<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="vid4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6b7a"/>
      <stop offset="0.55" stop-color="#2e4552"/>
      <stop offset="1" stop-color="#1c2b36"/>
    </linearGradient>
    <clipPath id="phoneClip4"><rect x="90" y="140" width="360" height="700" rx="28"/></clipPath>
    <clipPath id="mapClip4"><circle cx="168" cy="252" r="48"/></clipPath>
  </defs>
  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size: 30px; font-weight: bold; fill: #111; }
    .sub { font-size: 17px; fill: #555; }
    .ph { font-size: 26px; font-weight: bold; fill: #fff; }
    .small { font-size: 15px; fill: #666; }
    .label { font-size: 16px; font-weight: bold; fill: #444; }
    .badge { font-size: 14px; font-weight: bold; fill: #fff; }
    .opt { font-size: 20px; font-weight: bold; fill: #111; }
    .note { font-size: 16px; fill: #444; }
    .menuHint { font-size: 13px; fill: #bbb; }
    .flt { font-size: 15px; fill: #bbb; }
    .fltSel { font-size: 18px; font-weight: bold; fill: #fff; }
    .mOn { font-size: 15px; font-weight: bold; fill: #fff; }
    .mOff { font-size: 15px; fill: #888; }
    .mOnBig { font-size: 20px; font-weight: bold; fill: #fff; }
    .mOffBig { font-size: 20px; fill: #888; }
  </style>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="t title">StoryCam — Map &amp; compass wireframe v4 (for approval)</text>
  <text x="700" y="78" text-anchor="middle" class="t sub">New in v4: the bottom menu shows on / off at a glance — bold white vs transparent.</text>

  <!-- ============ LEFT: full-bleed camera screen ============ -->
  <text x="270" y="125" text-anchor="middle" class="t label">Camera screen — menu state is visible without opening Settings</text>
  <rect x="90" y="140" width="360" height="700" rx="28" fill="url(#vid4)"/>
  <g clip-path="url(#phoneClip4)">
    <circle cx="335" cy="215" r="26" fill="#ffffff" opacity="0.18"/>
    <path d="M90 520 Q 200 460 270 500 T 450 490 V 840 H 90 Z" fill="#000000" opacity="0.14"/>
    <path d="M90 600 Q 220 540 330 580 T 450 570 V 840 H 90 Z" fill="#000000" opacity="0.12"/>
    <rect x="90" y="720" width="360" height="120" fill="#000000" opacity="0.55"/>
    <line x1="90" y1="720" x2="450" y2="720" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
  </g>
  <text x="118" y="182" class="t ph">StoryCam</text>
  <!-- map circle top-left -->
  <g clip-path="url(#mapClip4)">
    <rect x="120" y="204" width="96" height="96" fill="#dce8d8"/>
    <path d="M120 232 H216 M120 268 H216 M148 204 V300 M182 204 V300" stroke="#fff" stroke-width="7"/>
    <path d="M120 232 H216 M120 268 H216 M148 204 V300 M182 204 V300" stroke="#b9c9b4" stroke-width="1"/>
    <rect x="150" y="234" width="30" height="32" fill="#c8d8c2"/>
  </g>
  <circle cx="168" cy="252" r="48" fill="none" stroke="#fff" stroke-width="2.5"/>
  <polygon points="168,236 162,249 174,249" fill="#fff" stroke="#222" stroke-width="1"/>
  <circle cx="168" cy="256" r="7" fill="#2b7de9" stroke="#fff" stroke-width="2"/>
  <text x="168" y="218" text-anchor="middle" class="t" font-size="13" font-weight="bold" fill="#ff8a9a">N</text>
  <rect x="192" y="200" width="52" height="22" rx="11" fill="#e94f64"/>
  <text x="218" y="215" text-anchor="middle" class="t badge">NEW</text>
  <!-- selfie circle -->
  <circle cx="362" cy="500" r="46" fill="#d5d5d5" stroke="#fff" stroke-width="2"/>
  <text x="362" y="505" text-anchor="middle" class="t small">FRONT</text>
  <!-- filter slider -->
  <g clip-path="url(#phoneClip4)">
    <text x="135" y="600" text-anchor="middle" class="t flt">Moody</text>
    <text x="190" y="600" text-anchor="middle" class="t flt">Hyper</text>
    <text x="270" y="600" text-anchor="middle" class="t fltSel">Original</text>
    <text x="340" y="600" text-anchor="middle" class="t flt">Midnight</text>
    <text x="398" y="600" text-anchor="middle" class="t flt">Simple</text>
    <text x="448" y="600" text-anchor="middle" class="t flt">Jakarta</text>
    <circle cx="270" cy="614" r="3" fill="#fff"/>
  </g>
  <!-- record button -->
  <circle cx="270" cy="662" r="38" fill="#e94f64" stroke="#fff" stroke-width="3"/>
  <!-- bottom text menu: ON = bold white, OFF = transparent not bold -->
  <text x="120" y="766" text-anchor="middle" class="t mOn">Map</text>
  <text x="175" y="766" text-anchor="middle" class="t mOn">Front</text>
  <text x="228" y="766" text-anchor="middle" class="t mOn">Rear</text>
  <text x="295" y="766" text-anchor="middle" class="t mOff">Captions</text>
  <text x="385" y="766" text-anchor="middle" class="t mOn">Settings</text>
  <text x="270" y="802" text-anchor="middle" class="t menuHint">tap an item — the Settings dialog opens at that section</text>
  <rect x="90" y="140" width="360" height="700" rx="28" fill="none" stroke="#222" stroke-width="2"/>
  <text x="270" y="868" text-anchor="middle" class="t" font-size="14" fill="#666">Map is on → bold white. Captions is off → transparent, not bold.</text>
  <text x="270" y="892" text-anchor="middle" class="t" font-size="14" font-weight="bold" fill="#c0392b">Filter slider (v3) and Settings dialog (v2) unchanged.</text>

  <!-- ============ RIGHT: menu state rule ============ -->
  <text x="910" y="125" text-anchor="middle" class="t label">Bottom menu — enabled vs disabled</text>
  <rect x="560" y="140" width="700" height="100" rx="18" fill="#1c2b36"/>
  <text x="660" y="197" text-anchor="middle" class="t mOnBig">Map</text>
  <text x="760" y="197" text-anchor="middle" class="t mOnBig">Front</text>
  <text x="850" y="197" text-anchor="middle" class="t mOnBig">Rear</text>
  <text x="960" y="197" text-anchor="middle" class="t mOffBig">Captions</text>
  <text x="1100" y="197" text-anchor="middle" class="t mOnBig">Settings</text>
  <!-- ON / OFF chips -->
  <rect x="560" y="270" width="340" height="90" rx="16" fill="#1c2b36"/>
  <text x="730" y="325" text-anchor="middle" class="t" font-size="24" font-weight="bold" fill="#fff">Map</text>
  <text x="730" y="392" text-anchor="middle" class="t note">Map ON — bold white</text>
  <rect x="920" y="270" width="340" height="90" rx="16" fill="#1c2b36"/>
  <text x="1090" y="325" text-anchor="middle" class="t" font-size="24" fill="#888">Map</text>
  <text x="1090" y="392" text-anchor="middle" class="t note">Map OFF — transparent, not bold</text>
  <!-- rule -->
  <rect x="560" y="430" width="700" height="140" rx="16" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5"/>
  <text x="590" y="466" class="t opt">The rule</text>
  <text x="590" y="496" class="t note">Bold white = enabled. Transparent and not bold = disabled.</text>
  <text x="590" y="522" class="t note">It applies to Map, Front, Rear and Captions. Settings is a button,</text>
  <text x="590" y="548" text-anchor="start" class="t note">so it stays bold white.</text>
  <!-- behaviour -->
  <rect x="560" y="600" width="700" height="190" rx="16" fill="#f2f2f2" stroke="#bbb" stroke-width="1"/>
  <text x="590" y="634" class="t opt">How it reads</text>
  <text x="590" y="664" class="t note">• The menu word itself shows the state — no need to open Settings.</text>
  <text x="590" y="690" class="t note">• Same language as the filter slider: selected = bold white,</text>
  <text x="590" y="716" class="t note">  the rest dimmed.</text>
  <text x="590" y="742" class="t note">• Tapping an item still opens the Settings dialog at that section —</text>
  <text x="590" y="768" text-anchor="start" class="t note">  say the word if tapping should toggle it directly instead.</text>
  <text x="700" y="920" text-anchor="middle" class="t sub">Wireframe v4 for approval — menu state added; everything else unchanged.</text>
</svg>
