  <text x="69" y="352" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#FFFFFF">Delete video?</text>
  <text x="69" y="382" font-family="DejaVu Sans" font-size="13" fill="#CCCCCC">This deletes the video from StoryCam</text>
